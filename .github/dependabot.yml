# Dependabot version updates. Each update arrives as a pull request into main and goes
# through the same checks as any other change (CONTRIBUTING.md): the Tests workflow on
# Python 3.11 to 3.13, and the mutation check, because dependency versions can change
# the simulator's numerics.
#
# requirements.txt pins NumPy separately for Python 3.11 and for 3.12+. An update that
# drops Python 3.11 support fails the 3.11 CI job and must not be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
