name: Tests

on:
  push:
    branches: [main, stage-2-rl]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # NumPy 2.5.5 in requirements.txt needs Python 3.12+, so 3.11 installs unpinned.
          - python-version: "3.11"
            install: numpy gymnasium pytest
          - python-version: "3.12"
            install: -r requirements.txt
          - python-version: "3.13"
            install: -r requirements.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install ${{ matrix.install }}

      - name: Show installed versions
        run: python -m pip list --format=freeze | grep -iE '^(numpy|gymnasium|pytest)=='

      - name: Run the test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest -v -p no:cacheprovider
